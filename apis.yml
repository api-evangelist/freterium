aid: freterium
name: Freterium
description: 'Freterium is a cloud-native AI Transport Management System (TMS) and unified logistics
  operating system that connects shippers, carriers, and fleets on a single intelligent layer. It spans
  first-mile, middle-mile, and last-mile operations across eight integrated modules — order management,
  AI-powered route planning, collaborative shipper and carrier portals, real-time GPS tracking with
  predictive ETAs, fleet management, freight billing and costing, intelligent document control, and
  analytics and reporting — and exposes a documented REST API for ERP/WMS integration alongside 50+
  off-the-shelf telematics and hardware integrations. Surfaced to the API Evangelist network as a
  Partech portfolio company.'
